<div class="register-container">

  <h1>Register</h1>

  <form (ngSubmit)="register()">

    <div class="row">
      <div class="field">
        <label for="first_name"><b>First Name</b></label>
        <input
          type="text"
          id="first_name"
          name="first_name"
          [(ngModel)]="first_name"
        />
      </div>

      <div class="field">
        <label for="last_name"><b>Last Name</b></label>
        <input
          type="text"
          id="last_name"
          name="last_name"
          [(ngModel)]="last_name"
        />
      </div>
    </div>

    <div class="field-full">
      <label for="email"><b>Email</b></label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
      />
    </div>

    <div class="row">
      <div class="field">
        <label for="password"><b>Password</b></label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
        />
      </div>

      <div class="field">
        <label for="confirm_password"><b>Confirm Password</b></label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          [(ngModel)]="confirm_password"
        />
      </div>
    </div>

    <button type="submit">
      <b>Register</b>
    </button>

  </form>

  <p><b>{{message}}</b></p>

  <p>
    Already have an account?
    <a href="/login">Login</a>
  </p>

</div>

@if(showSuccessPopup) {

  <div class="success-overlay">

    <div class="success-popup">

      <p>
        Register successful. Redirect to login page.
      </p>

      <div class="success-buttons">

        <button
          type="button"
          class="success-ok-button"
          (click)="closeSuccessPopup()"
        >
          OK
        </button>

        <button
          type="button"
          class="success-cancel-button"
          (click)="cancelSuccessPopup()"
        >
          Cancel
        </button>

      </div>

    </div>

  </div>

}
