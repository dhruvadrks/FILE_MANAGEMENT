<div class="reset-password-page">
    <img class="logo" src="/image.jpg" alt="logo">

    <div class="reset-password-container">
        <h1>Reset Password</h1>

        <form (ngSubmit)="reset_password()">

            <div class="field">
                <label for="new_password">New Password</label>
                <div class="input-wrap">
                    <input
                        [type]="showPassword ? 'text' : 'password'"
                        id="new_password"
                        name="new_password"
                        [(ngModel)]="new_password"
                    />
                    <button
                        type="button"
                        class="eye"
                        (click)="showPassword = !showPassword"
                        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                        [attr.aria-pressed]="showPassword"
                    >
                        {{ showPassword ? 'Hide' : 'Show' }}
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-wrap">
                    <input
                        [type]="showConfirmPassword ? 'text' : 'password'"
                        id="confirm_password"
                        name="confirm_password"
                        [(ngModel)]="confirm_password"
                    />
                    <button
                        type="button"
                        class="eye"
                        (click)="showConfirmPassword = !showConfirmPassword"
                        [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
                        [attr.aria-pressed]="showConfirmPassword"
                    >
                        {{ showConfirmPassword ? 'Hide' : 'Show' }}
                    </button>
                </div>
            </div>

            <button type="submit" class="submit" [disabled]="loading">
                {{ loading ? 'Resetting...' : 'Reset Password' }}
            </button>

        </form>

        @if (message) {
            <p class="message" [class.error]="messageType === 'error'" [class.success]="messageType === 'success'">
                {{ message }}
            </p>
        }

        <div class="links">
            <p>Back to <a routerLink="/login">Login</a></p>
        </div>
    </div>
</div>

@if (showSuccessPopup) {
    <div class="success-overlay">
        <div class="success-popup">
            <p>{{ message }}</p>
        </div>
    </div>
}
