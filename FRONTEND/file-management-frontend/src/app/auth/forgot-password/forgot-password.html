<div class="forgot-password-page">
    <img class="logo" src="/image.jpg" alt="logo">

    <div class="forgot-password-container">
        <h1>Forgot Password</h1>
        <p class="sub">Enter the email on your account and we'll send a reset link.</p>

        <form (ngSubmit)="forgot_password()">
            <div class="field">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    autocomplete="off"
                    [(ngModel)]="email"
                />
            </div>

            <button type="submit" class="submit" [disabled]="loading">
                {{ loading ? 'Sending...' : 'Send Reset Link' }}
            </button>
        </form>

        @if (message) {
            <p class="message" [class.error]="messageType === 'error'" [class.success]="messageType === 'success'">
                {{ message }}
            </p>
        }

        <div class="links">
            <a routerLink="/login">Back to Login</a>
        </div>
    </div>
</div>
