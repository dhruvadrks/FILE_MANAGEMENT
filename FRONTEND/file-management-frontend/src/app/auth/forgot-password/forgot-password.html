<div class="forgot-password-container">

  <h1>Forgot Password</h1>

  <form (ngSubmit)="forgot_password()">
    <div>
      <label for="email"><b>Email</b></label>

      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
      />
    </div>

    <button type="submit"><b>Send Reset Link</b></button>
  </form>
<p><b>{{message}}</b></p>

</div>
