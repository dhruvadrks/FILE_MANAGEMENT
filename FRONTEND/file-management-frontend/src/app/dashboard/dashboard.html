<div class="dashboard">

    <div class="dashboard-body">

        <aside class="sidebar">

            <img class="logo" src="/image.jpg" alt="Tricon Infotech">

            <button
                class="upload-button"
                type="button"
                (click)="fileInput.click()"
            >
                Upload File
            </button>

            <input
                #fileInput
                type="file"
                hidden
                (change)="UploadFile($event)"
            >

            <button
                class="sidebar-button"
                routerLink="/dashboard/files"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
            >
                My Files
            </button>

            <button
                class="sidebar-button"
                routerLink="/dashboard/favorites"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
            >
                Favorites
            </button>

            <button
                class="sidebar-button"
                routerLink="/dashboard/sharelinks"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
            >
                Share Links
            </button>

            <button
                class="sidebar-button profile-button"
                routerLink="/profile"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
            >
                <span class="avatar">{{ firstName.charAt(0) }}</span>
                <span class="profile-name">{{ firstName }}</span>
            </button>

            <button
                class="sidebar-button logout-button"
                (click)="logout()"
            >
                Logout
            </button>

        </aside>

        <main class="main-content">

            <router-outlet></router-outlet>

        </main>

    </div>

    @if (showMessage) {

        <div class="message-overlay">

            <div
                class="message-popup"
                [class.error]="messageType === 'error'"
            >

                <p>
                    {{ message }}
                </p>

            </div>

        </div>

    }

</div>
